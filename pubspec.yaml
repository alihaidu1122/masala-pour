name: masala_sort
description: Masala Pour — a spice-jar color puzzle game built with Flutter + Flame.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.34.0
  flame_audio: ^2.11.12
  flutter_riverpod: ^3.0.3
  shared_preferences: ^2.5.3
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    - assets/images/
    - assets/audio/
